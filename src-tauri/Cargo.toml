[package]
name = "bookweaver"
version = "0.1.0"
description = "BookWeaver - 책 요약 조각들을 통합하는 로컬 AI 앱"
authors = ["BookWeaver"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "bookweaver_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

# async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# HTTP / scraping
reqwest = { version = "0.12", features = ["json", "rustls-tls", "gzip", "brotli"], default-features = false }
scraper = "0.20"
url = "2"

# DB
rusqlite = { version = "0.32", features = ["bundled", "load_extension"] }
sqlite-vec = "0.1"

# config
directories = "5"
dotenvy = "0.15"
# NOTE: keyring 의존성은 keyring 마이그레이션 (ROADMAP 8단계) 시점에 추가 예정.
# 현재는 평문 config.json만 사용한다.

# serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# errors / logs
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
